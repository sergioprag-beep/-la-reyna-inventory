<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244b93">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Reyna Xpress">
<title>La Reyna Xpress — Sistema de Gestión</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./LOGO XPRESS-4(5).jpg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app" id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="./LOGO XPRESS-4(5).jpg" alt="La Reyna Xpress">
      <div><b>LA REYNA</b><span>XPRESS</span><small>Gestión de Restaurante</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
  </aside>
  <main>
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Abrir menú">☰</button>
      <div class="global-search" role="search"><span>⌕</span><input id="globalSearch" type="search" autocomplete="off" placeholder="Buscar módulo…"></div>
      <div class="topbar-spacer"></div>
      <button class="top-icon" id="notificationsBtn" type="button" aria-label="Notificaciones">🔔<span id="notificationBadge" class="notification-badge" hidden>0</span></button>
      <button class="profile-chip profile-button" id="profileBtn" type="button" aria-label="Abrir perfil">
        <div class="profile-avatar" id="profileAvatar">LR</div>
        <div class="profile-copy"><b id="profileName">Administrador LRX</b><small id="profileRole">Administrador</small></div>
      </button>
      <span class="clock" id="clock"></span>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="modalbox" id="modalBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./app.js"></script>
</body>
</html>
