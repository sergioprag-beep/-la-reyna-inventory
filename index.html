<style id="lrx-v176-purchase-css">.purchase-create-btn{width:100%;white-space:nowrap;min-height:40px}.purchase-create-btn.is-existing{opacity:1;border-color:#2e9b6f;background:#edf9f2;color:#16744d;cursor:default}.purchase-line .field label{font-weight:700}@media(max-width:760px){.purchase-line{grid-template-columns:1fr 1fr!important}.purchase-line .field:first-child{grid-column:1/-1}.purchase-line .purchase-create-btn{min-width:0}.purchase-line .bp-line-remove{align-self:end}.purchase-line label{font-size:11px}}</style><style id="lrx-v176-modal-fix">#modal.show{display:flex!important;pointer-events:auto!important;z-index:99999!important}#modal[hidden]{display:none!important;pointer-events:none!important}</style><style id="lrx-v176-product-cost-css">.product-cost-summary{margin-top:12px}.product-cost-summary b{font-weight:800}.product-cost-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}@media(max-width:760px){.product-cost-grid{grid-template-columns:1fr 1fr}}</style><style id="lrx-v184-pager-css">.pager{margin:16px 0 24px}.pager-info{font-size:12px;color:#667085;margin-bottom:8px}.pager-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pager-actions .btn{min-width:38px}.pager-actions .btn:disabled{opacity:.45;cursor:not-allowed}.pager-actions .btn.primary{font-weight:800}.pager-ellipsis{display:inline-flex;align-items:center;justify-content:center;min-width:24px;padding:7px 2px;color:#667085}.pager-size-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#667085}.pager-size-label select{padding:7px 8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}@media(max-width:760px){.pager-actions{gap:5px}.pager-actions .btn{padding:8px 10px;min-width:34px;font-size:12px}.pager-info{line-height:1.4}.pager-actions{max-width:100%;overflow-x:auto;padding-bottom:2px}}}</style>
<style id="lrx-v184-responsive-fix">
html,body{width:100%;min-width:0;max-width:100%;overflow-x:hidden}
body{margin:0}
.app{width:100%;min-width:0;max-width:100%;overflow-x:hidden}
#sidebar{flex:0 0 230px;min-width:0}
main{min-width:0;width:calc(100% - 230px);max-width:calc(100% - 230px);overflow-x:hidden}
.topbar{min-width:0;max-width:100%;width:100%;box-sizing:border-box;overflow:hidden}
.content{min-width:0;max-width:100%;width:100%;box-sizing:border-box;overflow-x:auto}
.module-page,.module-page>*{min-width:0;max-width:100%;box-sizing:border-box}
.module-head{min-width:0;max-width:100%}
.module-head .actions{min-width:0;max-width:100%;display:flex;flex-wrap:wrap;gap:8px}
.tablewrap{max-width:100%;overflow-x:auto}
.card{min-width:0;max-width:100%;box-sizing:border-box}
.grid{min-width:0;max-width:100%}
@media (max-width:1100px){
  #sidebar{flex-basis:210px;width:210px}
  main{width:calc(100% - 210px);max-width:calc(100% - 210px)}
  .topbar{gap:8px}
  .profile-copy{max-width:150px;overflow:hidden}
  .profile-copy b,.profile-copy small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;max-width:86vw;transform:translateX(-105%);z-index:10000;transition:transform .2s ease}
  #sidebar.open{transform:translateX(0)}
  main{width:100%;max-width:100%;min-width:0}
  .topbar{position:sticky;top:0;z-index:9000}
  .topbar-spacer{display:none}
  .global-search{min-width:0;flex:1 1 180px}
  .date-chip,.sync-status,.language-chip{display:none}
  .profile-copy{display:none}
  .module-head{align-items:flex-start}
  .module-head .actions{width:100%}
}
</style>
<style id="lrx-v188-production-label-css">
/* LRX v188 — Production + exact-size labels */
.production-create-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(180px,.75fr) minmax(180px,.75fr);gap:12px;align-items:end}
.production-create-grid .full{grid-column:1/-1}
.production-type-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.production-type-choices button{border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.production-type-choices button.active{border-color:#c92d6f;background:#fff0f6;color:#b11f5d;box-shadow:0 0 0 2px rgba(201,45,111,.08)}
.lrx-label-modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}
.lrx-label-subtitle{color:#667085;margin:4px 0 0}
.lrx-label-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.lrx-label-toolbar .input{min-width:180px}
.lrx-label-stage{background:#f2f4f7;border:1px solid #e4e7ec;border-radius:12px;padding:18px;display:flex;justify-content:center;align-items:center;overflow:auto}
.lrx-label-preview{background:#fff;border:1px solid #111;box-sizing:border-box;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.08);font-family:Arial,Helvetica,sans-serif;color:#111}
.lrx-label-inner{position:absolute;inset:3.2%;display:flex;flex-direction:column;min-height:0}
.lrx-label-logo-text{font-size:clamp(14px,3.6vw,32px);font-weight:900;text-align:center;letter-spacing:.2px;line-height:1.05;margin-bottom:4px}
.lrx-label-banner{background:#111;color:#fff;text-align:center;font-weight:900;padding:4px 6px;font-size:clamp(9px,1.6vw,18px);line-height:1.05}
.lrx-label-title-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:5px 0 6px}
.lrx-label-title{font-size:clamp(15px,3vw,28px);font-weight:900;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrx-label-type{border:1px solid #111;padding:4px 6px;font-size:clamp(7px,1.15vw,12px);font-weight:900;white-space:nowrap}
.lrx-label-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));border:1px solid #111;min-height:0;flex:1}
.lrx-label-cell{border-right:1px solid #111;border-bottom:1px solid #111;padding:4px 6px;min-width:0;overflow:hidden}
.lrx-label-cell:nth-child(2n){border-right:0}
.lrx-label-cell:nth-last-child(-n+2){border-bottom:0}
.lrx-label-cell b,.lrx-label-cell span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrx-label-cell b{font-size:clamp(7px,1.15vw,11px);line-height:1.05}
.lrx-label-cell span{font-size:clamp(8px,1.35vw,13px);line-height:1.1;margin-top:2px}
.lrx-label-lot{border:1px solid #111;margin-top:5px;padding:4px 6px;font-size:clamp(8px,1.25vw,13px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrx-label-code{text-align:center;font:900 clamp(11px,2vw,19px)/1.05 monospace;letter-spacing:1.5px;margin:5px 0}
.lrx-label-note{border-top:1px solid #111;padding-top:4px;font-size:clamp(6px,1vw,10px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrx-label-size-note{font-size:12px;color:#667085;margin:8px 0 0;text-align:center}
@media(max-width:900px){.production-create-grid{grid-template-columns:1fr 1fr}.production-create-grid .product-field{grid-column:1/-1}.lrx-label-toolbar{gap:6px}.lrx-label-stage{padding:10px}}
@media(max-width:600px){.production-create-grid{grid-template-columns:1fr}.production-create-grid .product-field{grid-column:auto}.lrx-label-stage{padding:6px}.lrx-label-toolbar .input{min-width:0;flex:1 1 180px}}
@media print{.lrx-label-print-root{margin:0!important;padding:0!important}}
</style></head>
<body>
<div class="app" id="app">
  <aside id="sidebar">
    <div class="brand brand-approved">
      <img src="./LOGO XPRESS-4(5).jpg" alt="La Reyna Xpress">
      <div class="brand-wordmark"><b>LRX</b><span>LA REYNA XPRESS</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-script">La Reyna Xpress</div>
      <div class="sidebar-motto">GOOD FOOD<br>GOOD MOOD</div>
      <small>LRX · Sistema de Gestión</small>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Abrir menú">☰</button>
      <div class="global-search approved-search" role="search">
        <span>⌕</span><input id="globalSearch" type="search" autocomplete="off" placeholder="Buscar productos, recetas, ventas, proveedores..."><kbd>⌘ K</kbd>
      </div>
      <div class="topbar-spacer"></div>
      <button class="date-chip" type="button" aria-label="Rango de fechas" data-action="date-range">▣ <b>01 Ene 2025</b><span>→</span><b>31 Dic 2025</b>⌄</button>
      <div class="sync-status"><span class="sync-dot"></span><b>Sincronizado</b></div>
      <button class="language-chip" type="button">🇺🇸 <b>ES</b>⌄</button>
      <button class="top-icon voice-button" id="voiceBtn" type="button" data-action="voice-action" aria-label="Acción por voz">🎙️</button>
      <button class="top-icon" id="captureBtn" type="button" data-action="capture-documents" aria-label="Capturar o importar documento">📎</button>
      <button class="top-icon" id="cameraBtn" type="button" data-action="camera-capture" aria-label="Tomar fotografía">📷</button>
      <button class="top-icon" id="notificationsBtn" type="button" aria-label="Notificaciones">🔔<span id="notificationBadge" class="notification-badge" hidden>0</span></button>
      <button class="profile-chip profile-button" id="profileBtn" type="button" aria-label="Abrir perfil">
        <div class="profile-avatar" id="profileAvatar">LR</div>
        <div class="profile-copy"><b id="profileName">Administrador LRX</b><small id="profileRole">Administrador</small></div><span class="profile-chevron">⌄</span>
      </button>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="modalbox" id="modalBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="./purchase-engine.js?v=2026-09-30-v188" defer></script>
<script src="./app.js?v=2026-09-30-v188" defer></script>
</body>
</html>
